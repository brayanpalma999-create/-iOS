name: atob_app
description: AtoB dispatch and intercom platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  socket_io_client: ^3.1.2
  google_maps_flutter: ^2.15.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  just_audio: ^0.10.5
  vibration: ^3.1.4
  google_fonts: ^6.3.2
  permission_handler: ^12.0.1
  shared_preferences: 2.2.3
  image_picker: 1.0.8
  livekit_client: ^2.7.0
  crypto: ^3.0.6
  flutter_compass: ^0.8.1
  sentry_flutter: ^9.7.0
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  connectivity_plus: 7.0.0
  path_provider_android: 2.2.20
  shared_preferences_android: 2.2.3
  image_picker_android: 0.8.12+3
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/ptt_on.wav
    - assets/sounds/ptt_off.wav
    - assets/sounds/private_beep.wav
    - assets/sounds/busy_beep.wav
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/atob_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: assets/branding/atob_mark.png
  remove_alpha_ios: true
