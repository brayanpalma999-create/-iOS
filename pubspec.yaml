name: atob_app
description: AtoB dispatch and intercom platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  socket_io_client: ^3.1.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  just_audio: ^0.10.5
  vibration: ^3.1.4
  google_fonts: ^6.3.2
  permission_handler: ^12.0.1
  shared_preferences: 2.2.3
  image_picker: 1.0.8
  livekit_client: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dependency_overrides:
  path_provider_android: 2.2.20
  shared_preferences_android: 2.2.3
  image_picker_android: 0.8.12+3
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/ptt_on.wav
    - assets/sounds/ptt_off.wav
    - assets/sounds/private_beep.wav
    - assets/sounds/busy_beep.wav
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/atob_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: assets/branding/atob_mark.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#050505"
  color_dark: "#050505"
  image: assets/branding/atob_mark.png
  image_dark: assets/branding/atob_mark.png
  android_12:
    color: "#050505"
    color_dark: "#050505"
    image: assets/branding/atob_mark.png
    image_dark: assets/branding/atob_mark.png
  web: false
